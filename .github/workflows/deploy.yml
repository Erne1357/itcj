name: Deploy ITCJ to Production

on:
  push:
    branches:
      - main
  # Manual: siempre carril completo. Desde una rama que no sea main, deploy.sh
  # rechaza el commit (solo despliega commits de origin/main).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Carril del deploy:
  # - full (por omisión): suite completa en 8 shards ANTES del deploy (~6-8 min).
  # - hotfix: el PR fusionado trae el label `hotfix` → solo humo antes del
  #   deploy (compile + tests/fastapi/infra: la app arranca, /ready ve BD y
  #   Redis, invariantes de compose/nginx/deploy.sh) y la suite completa
  #   DESPUÉS. Ante cualquier duda (API caída, push directo sin PR, dispatch
  #   manual) → full.
  # ---------------------------------------------------------------------------
  plan:
    name: Carril
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Elegir carril por el label del PR fusionado
        id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          lane=full
          labels=""
          if [ "$EVENT" = "push" ]; then
            labels=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null) | .labels[].name] | join(",")' \
              2>/dev/null) || labels=""
            case ",$labels," in
              *,hotfix,*) lane=hotfix ;;
            esac
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "### Carril: \`$lane\` (labels del PR: ${labels:-ninguno})" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    needs: plan
    if: ${{ needs.plan.outputs.lane == 'full' }}
    uses: ./.github/workflows/_tests.yml

  smoke:
    name: Humo (hotfix)
    needs: plan
    if: ${{ needs.plan.outputs.lane == 'hotfix' }}
    uses: ./.github/workflows/_tests.yml
    with:
      serial: true
      target: tests/fastapi/infra

  # ---------------------------------------------------------------------------
  # Carril full: si main ya avanzó más allá de este commit, NO se despliega —
  # el run del commit más nuevo lo hará, y lo incluye. Sobre todo evita que
  # este run entre a la cola de production-deploy: GitHub cancela al deploy
  # PENDIENTE cuando llega otro, por orden de llegada y no por antigüedad del
  # commit, así que un run viejo desplazaría a un hotfix que esperaba turno.
  # Si la API falla → no superado (deploy.sh trae su propia guarda de orden).
  # ---------------------------------------------------------------------------
  gate:
    name: ¿Sigue siendo la punta de main?
    needs: [plan, tests]
    if: ${{ needs.plan.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      superseded: ${{ steps.tip.outputs.superseded }}
    steps:
      - name: Comparar con main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          ahead=$(gh api "repos/$REPO/compare/$SHA...main" --jq '.ahead_by' 2>/dev/null) || ahead=0
          superseded=false
          if [ "${ahead:-0}" -gt 0 ] 2>/dev/null; then
            superseded=true
            echo "### main ya avanzó $ahead commit(s) más allá de este: el deploy lo hará el run más nuevo." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "superseded=$superseded" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Deploy del commit EXACTO que se probó (github.sha), no de la punta de main.
  # El deploy.sh que corre es el de ese commit (git show), no el del checkout
  # del servidor: así un cambio al script surte efecto en el mismo deploy.
  # concurrency: un deploy a la vez; deploy.sh además se niega a regresar prod
  # a un ancestro de lo que ya sirve (run viejo que terminó tras un hotfix).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Server (Zero-Downtime)
    needs: [plan, tests, smoke, gate]
    if: >-
      ${{ always() && needs.plan.result == 'success' && (
        (needs.plan.outputs.lane == 'full' && needs.tests.result == 'success' &&
         needs.gate.result == 'success' && needs.gate.outputs.superseded != 'true') ||
        (needs.plan.outputs.lane == 'hotfix' && needs.smoke.result == 'success')
      ) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH (Blue-Green)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            set -e
            echo ">>> Iniciando deploy blue-green de ${{ github.sha }}..."
            cd /home/cuaderno/ITCJ
            git fetch origin
            DEPLOY_SCRIPT=$(mktemp)
            trap 'rm -f "$DEPLOY_SCRIPT"' EXIT
            git show "${{ github.sha }}:docker/scripts/deploy.sh" > "$DEPLOY_SCRIPT"
            bash "$DEPLOY_SCRIPT" "${{ github.sha }}" 2>&1

      - name: Notify deployment status
        if: always()
        env:
          STATUS: ${{ job.status }}
          LANE: ${{ needs.plan.outputs.lane }}
        run: |
          if [ "$STATUS" == "success" ]; then
            echo "Deployment successful ($LANE) - Zero downtime achieved"
          else
            echo "Deployment failed ($LANE) - Check logs for details"
          fi

  # Respaldo del gate: si el deploy de un hotfix queda cancelado (desplazado de
  # la cola o cancelado a mano), el hotfix NO está en prod y un job cancelado
  # no pone el run en rojo ni manda correo.
  deploy-cancel-alert:
    name: Alerta (deploy de hotfix cancelado)
    needs: [plan, deploy]
    if: ${{ always() && needs.plan.outputs.lane == 'hotfix' && needs.deploy.result == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Avisar
        env:
          SHA: ${{ github.sha }}
        run: |
          msg="El deploy del hotfix $SHA se canceló y NO está en prod. Re-ejecuta el job «Deploy to Server» de este run (deploy.sh no regresa prod si ya sirve algo más nuevo)."
          echo "::error::$msg"
          { echo "## Hotfix sin desplegar"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ---------------------------------------------------------------------------
  # Solo carril hotfix: la suite completa corre DESPUÉS del deploy. Si sale
  # roja, el run queda rojo (correo de GitHub) y verify-alert lo explica.
  # always(): sin él, el `tests` saltado del carril hotfix saltaría este job.
  # ---------------------------------------------------------------------------
  verify:
    name: Verificación post-deploy (hotfix)
    needs: [plan, deploy]
    if: ${{ always() && needs.plan.outputs.lane == 'hotfix' && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/_tests.yml

  verify-alert:
    name: Alerta (hotfix con suite roja)
    needs: verify
    if: ${{ always() && needs.verify.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Avisar
        env:
          SHA: ${{ github.sha }}
        run: |
          msg="El hotfix $SHA ya está en prod y la suite completa salió ROJA. Corrige con otro PR o revierte en el servidor con docker/scripts/rollback.sh (no revierte la BD)."
          echo "::error::$msg"
          { echo "## Hotfix con suite roja"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          exit 1
