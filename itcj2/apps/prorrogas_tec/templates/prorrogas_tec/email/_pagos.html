<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:0 0 16px;background-color:#EEF3FC;border:1px solid #D3E1F6;">
  {%- for p in pagos %}
  <tr>
    <td style="padding:12px 0 12px 20px;border-bottom:1px solid #D3E1F6;font-family:Arial,Helvetica,sans-serif;">
      <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;font-weight:700;color:#1A130E;">{{ p.etiqueta }}</p>
      <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#5C5650;">{{ p.fecha }}</p>
    </td>
    <td align="right" style="padding:12px 20px 12px 8px;border-bottom:1px solid #D3E1F6;text-align:right;vertical-align:middle;white-space:nowrap;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;font-weight:700;color:#1A130E;">{{ p.monto }}</td>
  </tr>
  {%- endfor %}
  <tr>
    <td style="padding:12px 0 12px 20px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#1A130E;">Total</td>
    <td align="right" style="padding:12px 20px 12px 8px;text-align:right;white-space:nowrap;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:22px;font-weight:700;color:#1A130E;">{{ total }}</td>
  </tr>
</table>
