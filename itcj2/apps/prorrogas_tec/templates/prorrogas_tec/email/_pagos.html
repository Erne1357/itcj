<table width="100%" cellpadding="0" cellspacing="0" style="margin:16px 0;font-size:14px;">
  {% for p in pagos %}
  <tr>
    <td style="padding:6px 0;border-bottom:1px solid #ECEFF1;">{{ p.etiqueta }}</td>
    <td style="padding:6px 0;border-bottom:1px solid #ECEFF1;">{{ p.fecha }}</td>
    <td style="padding:6px 0;border-bottom:1px solid #ECEFF1;text-align:right;">{{ p.monto }}</td>
  </tr>
  {% endfor %}
  <tr><td colspan="2" style="padding:8px 0;"><strong>Total</strong></td><td style="padding:8px 0;text-align:right;"><strong>{{ total }}</strong></td></tr>
</table>
