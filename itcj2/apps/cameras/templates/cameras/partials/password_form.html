{# Formulario del jefe/gestor: solo contraseña. Nunca devuelve lo escrito. #}
<form class="cam-form cam-form--narrow" hx-post="/cameras/dvrs/{{ d.id }}/password" hx-target="#cam-dvr-{{ d.id }}" hx-swap="outerHTML" autocomplete="off">
  <p class="cam-note"><i class="bi bi-info-circle" aria-hidden="true"></i><span>Cámbiala aquí después de cambiarla en el DVR. Soporte verá quién la actualizó y cuándo.</span></p>
  <div class="cam-field">
    <label class="form-label" for="pw-{{ d.id }}">Contraseña nueva</label>
    <input class="form-control" id="pw-{{ d.id }}" name="password" type="password" autocomplete="off" required aria-describedby="pw-hint-{{ d.id }}">
    <p class="cam-field__hint" id="pw-hint-{{ d.id }}">Escríbela tal como la tecleas en el DVR: cuentan mayúsculas, minúsculas y espacios.</p>
  </div>
  <div class="cam-field">
    <label class="form-label" for="pw2-{{ d.id }}">Confírmala</label>
    <input class="form-control{% if error %} is-invalid{% endif %}" id="pw2-{{ d.id }}" name="password_confirm" type="password" autocomplete="off" required{% if error %} aria-invalid="true" aria-describedby="pw2-err-{{ d.id }}"{% endif %}>
    {% if error %}<p class="cam-field__error" id="pw2-err-{{ d.id }}"><i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>{{ error }}</p>{% endif %}
  </div>
  <div class="cam-form__actions">
    <button type="submit" class="cam-btn cam-btn--primary"><span class="cam-spin" aria-hidden="true"></span><span>Guardar contraseña</span></button>
  </div>
</form>
