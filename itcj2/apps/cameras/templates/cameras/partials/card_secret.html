{# Versión sellada: cam-secret con «Revelar». También va dentro de <template data-cam-sealed>. #}
<div class="cam-secret" id="cam-secret-{{ d.id }}">
  <div class="cam-seal">
    <span class="cam-seal__tile {% if d.pattern_cipher %}cam-seal__tile--pattern" aria-hidden="true"></span>{% else %}cam-seal__tile--password" aria-hidden="true"><i class="bi bi-key-fill"></i></span>{% endif %}
    <ul class="cam-seal__what" aria-label="Guardado en este DVR">
      {% if d.pattern_cipher %}<li class="cam-badge"><i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>Patrón</li>{% endif %}
      {% if d.password_cipher %}<li class="cam-badge"><i class="bi bi-key-fill" aria-hidden="true"></i>Contraseña</li>{% endif %}
    </ul>
    <button type="button" class="cam-btn cam-btn--reveal" hx-post="/cameras/dvrs/{{ d.id }}/reveal" hx-target="#cam-secret-{{ d.id }}" hx-swap="outerHTML"><i class="bi bi-eye-fill" aria-hidden="true"></i><span class="cam-spin" aria-hidden="true"></span><span>Revelar</span></button>
    {% if error %}<p class="cam-seal__error" role="alert"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span>No se pudo revelar. {{ error }} Avísale a Soporte.</span></p>{% endif %}
  </div>
</div>
