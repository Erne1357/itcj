<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cámaras{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <!-- Shell móvil compartido (botón "volver al inicio" cuando corre en el iframe del dashboard). -->
  <link rel="stylesheet" href="/static/core/css/apps/mobile-app-shell.css?v={{ sv_core('css/apps/mobile-app-shell.css') }}">
  <link rel="stylesheet" href="/static/cameras/css/cameras.css?v={{ sv('css/cameras.css') }}">
</head>
<body class="cam-body" hx-ext="morph" hx-history="false">
  <!-- App bar: solo visible dentro del iframe móvil (body.in-mobile-iframe). -->
  <header class="cam-appbar">
    <button type="button" class="mobile-back-to-dashboard" id="mobileBackToDashboard" title="Volver al inicio" aria-label="Volver al inicio">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
    </button>
    <span class="cam-appbar__title"><i class="bi bi-camera-video-fill" aria-hidden="true"></i>Cámaras</span>
  </header>

  {% block body %}{% endblock %}

  <!-- HTMX + Idiomorph (siempre después de HTMX). -->
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://unpkg.com/idiomorph@0.7.3/dist/idiomorph-ext.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/cameras/js/pattern.js?v={{ sv('js/pattern.js') }}"></script>
  <script src="/static/cameras/js/cameras.js?v={{ sv('js/cameras.js') }}"></script>
  <script src="/static/core/js/apps/mobile-app-shell.js?v={{ sv_core('js/apps/mobile-app-shell.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
