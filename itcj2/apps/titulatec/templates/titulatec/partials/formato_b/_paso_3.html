{% from "titulatec/partials/formato_b/_macros.html" import cls, notes, summary %}
<form class="p-3 d-grid gap-3" novalidate id="fb-form-3"
      hx-post="/titulatec/student/formato-b/step/3" hx-target="#formato-b-body"
      hx-swap="outerHTML show:window:top">
  {{ summary(errors) }}

  {% if requires_project %}
  <div><label class="tt-label" for="fb-project">Nombre del proyecto</label>
    <textarea class="form-control{{ cls(errors, obs, 'project_name') }}" id="fb-project" name="project_name"
              rows="4" maxlength="500" autocomplete="off"
              placeholder="Título de tu trabajo de titulación"
              {{ 'autofocus' if first_error == 'project_name' }}>{{ datos.project_name }}</textarea>
    <p class="tt-fb-help mb-0">De 10 a 500 caracteres.</p>
    {{ notes(errors, obs, 'project_name') }}</div>
  {% else %}
  <div class="tt-card" id="fb-no-project">
    <i class="bi bi-info-circle"></i>
    Tu tipo de titulación no pide nombre de proyecto. Continúa a la revisión.
  </div>
  {% endif %}

  <div class="d-flex gap-2">
    <button type="button" class="btn tt-btn-ghost" aria-label="Volver al paso 2"
            hx-get="/titulatec/student/formato-b/step/2" hx-target="#formato-b-body"
            hx-swap="outerHTML show:window:top"><i class="bi bi-arrow-left"></i></button>
    <button class="btn tt-btn-ink flex-grow-1" style="height:52px">Continuar a revisión <i class="bi bi-arrow-right ms-1"></i></button>
  </div>
</form>
