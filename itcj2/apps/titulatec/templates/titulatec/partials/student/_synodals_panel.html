{# «Tus sinodales» (spec fase 4 §14): posición y nombre de los vigentes, SIN
   cédula ni grado. Recibe `synodals` (lista de {role_label, name}). #}
<div data-tt-student-sinodales>
  <div class="tt-acc-block-title"><i class="bi bi-people"></i>Tus sinodales</div>
  <ul class="tt-prose mb-0" style="font-size:.83rem;padding-left:1.1rem">
    {% for s in synodals %}
    <li data-tt-sinodal><strong>{{ s.role_label }}:</strong> {{ s.name }}</li>
    {% endfor %}
  </ul>
</div>
