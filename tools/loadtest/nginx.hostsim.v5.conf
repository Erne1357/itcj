# v5 — propuesta FINAL para el nginx del host (aqui sin TLS, para el ensayo).
#
# Dos capas de defensa:
#   1. Campus conocido (NAT confirmado: 5 navegadores distintos tras la misma
#      IP) -> cupo propio, alto, COMPARTIDO por toda la red.
#   2. Todo lo demas -> limite por IP, pero subido a valores que no rompen un
#      NAT desconocido (los alumnos pueden salir por otra IP del Tec que aun
#      no conocemos, o por datos moviles).
worker_processes auto;
events { worker_connections 8192; }

http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  include       /etc/nginx/mime.types;
  server_tokens off;
  sendfile on;

  client_max_body_size 30m;

  # --- Identificacion de la red del Tec -------------------------------------
  # 172.19.0.0/16 = gateway de Docker (el "campus" de este ensayo).
  # En produccion: 201.174.23.164/32 + las IPs del WiFi de alumnos cuando se
  # confirmen (ver §5.1 del runbook).
  geo $is_campus {
    default 0;
    172.19.0.0/16 1;
  }
  # Externos: la clave es su IP. Campus: clave vacia = NO entra a estas zonas.
  map $is_campus $key_ext {
    0 $binary_remote_addr;
    1 "";
  }
  # Campus: una sola clave compartida por toda la red. Externos: exentos.
  map $is_campus $key_campus {
    0 "";
    1 "campus";
  }

  # --- Zonas ----------------------------------------------------------------
  limit_req_zone  $key_ext    zone=ext:10m           rate=100r/s;
  limit_req_zone  $key_campus zone=campus:10m        rate=300r/s;
  limit_req_zone  $key_ext    zone=ext_login:10m     rate=5r/s;
  limit_req_zone  $key_campus zone=campus_login:10m  rate=30r/s;

  limit_conn_zone $key_ext    zone=conn_ext:10m;
  limit_conn_zone $key_campus zone=conn_campus:10m;
  # WebSockets en zona APARTE: son conexiones de horas, no se pueden medir con
  # la misma vara que un GET de 20ms.
  limit_conn_zone $key_ext    zone=ws_ext:10m;
  limit_conn_zone $key_campus zone=ws_campus:10m;

  limit_req_status 429;
  limit_conn_status 429;

  log_format sim '$remote_addr $status $request_uri';
  access_log /var/log/nginx/access.log sim;

  server {
    listen 80;
    server_name _;

    limit_conn conn_ext 300;
    limit_conn conn_campus 6000;

    # Estaticos: los sirve nginx, nunca tocan la app. Fuera de limit_req para
    # que una carga en frio (14 peticiones) no queme el cupo de la IP.
    location /static/ {
      proxy_pass http://nginx;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io/ {
      # Un limit_conn en la location REEMPLAZA los heredados del server.
      limit_conn ws_ext 300;
      limit_conn ws_campus 6000;
      proxy_pass http://nginx/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_connect_timeout 60s;
      proxy_buffering off;
    }

    location = /api/core/v2/auth/login {
      limit_req zone=ext_login    burst=10 nodelay;
      limit_req zone=campus_login burst=60 nodelay;
      proxy_pass http://nginx;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      limit_req zone=ext    burst=200 nodelay;
      limit_req zone=campus burst=600 nodelay;
      proxy_pass http://nginx;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
