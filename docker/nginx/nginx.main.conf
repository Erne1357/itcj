# Config raíz de nginx en prod. Se monta como ARCHIVO ÚNICO en /etc/nginx/nginx.conf.
#
# Trampa: un bind mount de archivo queda atado al INODO original. `git reset --hard`
# (deploy.sh) reemplaza un archivo modificado creando uno nuevo, así que el contenedor
# seguiría viendo la config vieja: `nginx -s reload` recargaría lo viejo con el deploy
# en verde. Por eso la config real (nginx.prod.conf) se monta como DIRECTORIO en
# /etc/nginx/itcj, donde un archivo nuevo sí es visible, y este archivo solo la incluye.
#
# NO hacer crecer este archivo: si cambia, sufre el mismo bug y cambiarlo exige
# recrear nginx (`up -d --force-recreate nginx`), no basta un reload.
include /etc/nginx/itcj/nginx.prod.conf;
