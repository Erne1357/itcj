worker_processes 1;
events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --- Puerta del túnel de dev ------------------------------------------
    # Cuando el entorno de dev se expone por un túnel (tunnelmole/ngrok) para que
    # alguien pruebe desde fuera, la app NO puede ser la única puerta: esta BD
    # tiene datos reales, /api/openapi.json publica 649 rutas de las 7 apps y
    # `auth_basic` acepta variables, así que se activa SOLO por Host: localhost
    # sigue entrando sin contraseña y el túnel exige credencial.
    # El fichero de credenciales está gitignored (docker/nginx/tunnel.htpasswd);
    # créalo con `htpasswd -B` o un bcrypt $2y$ antes de levantar el túnel.
    map $http_host $tunnel_auth {
        default                     off;
        "~*\.tunnelmole\.net$"      "ITCJ dev - acceso restringido";
        "~*\.ngrok(-free)?\.(io|app|dev)$" "ITCJ dev - acceso restringido";
        "~*\.trycloudflare\.com$"   "ITCJ dev - acceso restringido";
    }

    upstream backend {
        server backend:8001;
        keepalive 32;
    }

    # 2.1 — Socket.IO en su propio proceso (espejo de prod).
    upstream sockets {
        server sockets:8001;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 30M;

        # Vacío para localhost (auth_basic off), activo si el Host es de un túnel.
        auth_basic           $tunnel_auth;
        auth_basic_user_file /etc/nginx/tunnel.htpasswd;

        # Archivos estáticos
        location /static/core/ {
            alias /www/static/core/;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        location /static/agendatec/ {
            alias /www/static/agendatec/;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        location /static/helpdesk/ {
            alias /www/static/helpdesk/;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        location /static/vistetec/ {
            alias /www/static/vistetec/;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        location /static/maint/ {
            alias /www/static/maint/;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        location /static/titulatec/ {
            alias /www/static/titulatec/;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        location /static/directory/ {
            alias /www/static/directory/;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # SocketIO (python-socketio ASGI) → contenedor `sockets`
        location /socket.io/ {
            proxy_pass http://sockets;
            proxy_http_version 1.1;
            proxy_buffering off;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 86400;

            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;
        }

        # Todo lo demás → FastAPI
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
