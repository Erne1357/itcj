worker_processes 1;
events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend {
        server backend:8001;
        keepalive 32;
    }

    # 2.1 — Socket.IO en su propio proceso (espejo de prod).
    upstream sockets {
        server sockets:8001;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 30M;

        # Archivos estáticos
        location /static/core/ {
            alias /www/static/core/;
            access_log off;
            # Dev: revalidar siempre. Con `immutable` el navegador ni pregunta y
            # un cambio de CSS/JS no se ve hasta que caduca, ni recargando.
            expires -1;
        }

        location /static/agendatec/ {
            alias /www/static/agendatec/;
            access_log off;
            # Dev: revalidar siempre. Con `immutable` el navegador ni pregunta y
            # un cambio de CSS/JS no se ve hasta que caduca, ni recargando.
            expires -1;
        }

        location /static/helpdesk/ {
            alias /www/static/helpdesk/;
            access_log off;
            # Dev: revalidar siempre. Con `immutable` el navegador ni pregunta y
            # un cambio de CSS/JS no se ve hasta que caduca, ni recargando.
            expires -1;
        }

        location /static/vistetec/ {
            alias /www/static/vistetec/;
            access_log off;
            # Dev: revalidar siempre. Con `immutable` el navegador ni pregunta y
            # un cambio de CSS/JS no se ve hasta que caduca, ni recargando.
            expires -1;
        }

        location /static/maint/ {
            alias /www/static/maint/;
            access_log off;
            # Dev: revalidar siempre. Con `immutable` el navegador ni pregunta y
            # un cambio de CSS/JS no se ve hasta que caduca, ni recargando.
            expires -1;
        }

        location /static/titulatec/ {
            alias /www/static/titulatec/;
            access_log off;
            # Dev: revalidar siempre. Con `immutable` el navegador ni pregunta y
            # un cambio de CSS/JS no se ve hasta que caduca, ni recargando.
            expires -1;
        }

        location /static/directory/ {
            alias /www/static/directory/;
            access_log off;
            # Dev: revalidar siempre. Con `immutable` el navegador ni pregunta y
            # un cambio de CSS/JS no se ve hasta que caduca, ni recargando.
            expires -1;
        }

        location /static/adhoc/ {
            alias /www/static/adhoc/;
            access_log off;
            # Dev: revalidar siempre. Con `immutable` el navegador ni pregunta y
            # un cambio de CSS/JS no se ve hasta que caduca, ni recargando.
            expires -1;
        }

        # SocketIO (python-socketio ASGI) → contenedor `sockets`
        location /socket.io/ {
            proxy_pass http://sockets;
            proxy_http_version 1.1;
            proxy_buffering off;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 86400;

            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;
        }

        # Todo lo demás → FastAPI
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
