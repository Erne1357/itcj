name: itcj
services:
  redis:
    restart: always
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  postgres:
    restart: always
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile.db
    env_file: ../../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/init-itcj.sh:/docker-entrypoint-initdb.d/init-itcj.sh:ro
      - ../../database/backup_itcj_2026-08-21.sql:/docker-entrypoint-initdb.d/itcj_backup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "5432:5432"

  pgbouncer:
    build:
      context: ../backend/pgbouncer
      dockerfile: Dockerfile
    restart: always
    env_file: ../../.env    # env_file resuelve relativo al compose file → provee POSTGRES_USER/PASSWORD al contenedor
    environment:
      - TZ=America/Ciudad_Juarez
    volumes:
      - ../backend/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    #restart: always
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile.fastapi
    env_file: ../../.env
    # 2.1 — Dev reproduce el SPLIT de prod: este contenedor solo sirve HTTP y
    # NO monta /socket.io/ (lo hace `sockets`). Sin esta paridad, un bug del
    # split solo aparecería en producción.
    # Los workers siguen siendo 1 (--reload no permite más), lo que se prueba
    # aquí es la topología, no la concurrencia.
    environment:
      - APP_ROLE=http
    volumes:
      - ../../:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Dev: wait redis + alembic upgrade head + uvicorn --reload
    entrypoint: ["/bin/sh", "/app/docker/backend/entrypoint-fastapi-dev.sh"]
    #ports:
    #  - "8001:8001"  # Para desarrollo directo sin nginx

  # ============================================
  # SOCKETS — Socket.IO dedicado (espejo de prod)
  # ============================================
  sockets:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile.fastapi
    env_file: ../../.env
    environment:
      - APP_ROLE=socket
      # Las migraciones las corre `backend`; dos alembic a la vez compiten.
      - RUN_MIGRATIONS=0
      # Mismo pool que prod (paridad): asi el herd se ensaya con el valor real.
      - DB_POOL_SIZE=16
      - DB_MAX_OVERFLOW=16
    volumes:
      - ../../:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/docker/backend/entrypoint-fastapi-dev.sh"]

  # ============================================
  # CELERY WORKER
  # ============================================
  celery-worker:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile.fastapi
    env_file: ../../.env
    volumes:
      - ../../:/app
    entrypoint: ["/bin/sh", "/app/docker/backend/celery/entrypoint-worker.sh"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # CELERY BEAT (scheduler)
  # ============================================
  celery-beat:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile.fastapi
    env_file: ../../.env
    volumes:
      - ../../:/app
    entrypoint: ["/bin/sh", "/app/docker/backend/celery/entrypoint-beat.sh"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    restart: always
    image: nginx:alpine
    environment:
      TZ: America/Ciudad_Juarez
    volumes:
      - ../nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      # Archivos estáticos de las apps
      - ../../itcj2/core/static:/www/static/core:ro
      - ../../itcj2/apps/agendatec/static:/www/static/agendatec:ro
      - ../../itcj2/apps/helpdesk/static:/www/static/helpdesk:ro
      - ../../itcj2/apps/vistetec/static:/www/static/vistetec:ro
      - ../../itcj2/apps/maint/static:/www/static/maint:ro
      - ../../itcj2/apps/titulatec/static:/www/static/titulatec:ro
      - ../../itcj2/apps/directory/static:/www/static/directory:ro
    depends_on:
      # nginx resuelve los nombres de upstream al arrancar: ambos deben existir.
      - backend
      - sockets
    ports:
      - "8080:80"

volumes:
  pgdata:
